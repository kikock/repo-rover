[package]
name = "repo-rover"
version = "1.0.3"
description = "Git 仓库全盘探针与资产管理中心"
authors = ["kikock"]
edition = "2021"

[lib]
name = "repo_rover_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
tauri-plugin-single-instance = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
tokio = { version = "1.38", features = ["full"] }
which = "6.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
